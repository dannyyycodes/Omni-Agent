{% extends "base.html" %}

{% block content %}
<div class="header">
    <h1>Projects</h1>
    <p>Organize your work and memories.</p>
</div>

<div class="stats-grid">
    <div class="stat-card glass-panel"
        style="border-style: dashed; display: flex; align-items: center; justify-content: center; cursor: pointer;"
        onclick="window.location.href='/chat?msg=Create a new project'">
        <div style="text-align: center;">
            <i data-lucide="plus" size="32" style="margin-bottom: 10px; color: var(--accent-primary);"></i>
            <div>New Project</div>
        </div>
    </div>

    <!-- Example Project Card -->
    <div class="stat-card glass-panel">
        <div class="stat-label">Project</div>
        <div class="stat-value" style="font-size: 1.5rem;">Sora Automations</div>
        <p style="color: var(--text-secondary); margin-top: 10px; font-size: 0.9rem;">
            Contains Video Generator logic.
        </p>
        <button class="btn" style="margin-top: 20px; width: 100%; background: rgba(255,255,255,0.05);"
            onclick="window.location.href='/chat?project_id=sora'">
            Open Chat
        </button>
    </div>
</div>
{% endblock %}
