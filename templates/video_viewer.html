<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Facts - Video Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            font-weight: 600;
            margin: 10px 0;
        }

        .status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status.processing {
            background: #dbeafe;
            color: #1e40af;
        }

        .status.completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .video-container {
            margin-top: 20px;
            text-align: center;
        }

        video {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .info {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .task-list {
            margin-top: 20px;
        }

        .task-item {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🐾 Animal Facts Video Viewer</h1>

        <div class="card">
            <h2>Generate New Video</h2>
            <p style="margin: 15px 0; color: #666;">Click to generate a new animal fact video with Sora 2</p>
            <button class="btn" onclick="generateVideo()">🎬 Generate Video</button>
            <button class="btn" onclick="generateVideo(true)"
                style="margin-left: 10px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">🧪 Dry Run
                (Test)</button>
        </div>

        <div class="card">
            <h2>Current Task</h2>
            <div id="currentTask">
                <p style="color: #666;">No active task. Click "Generate Video" to start!</p>
            </div>
        </div>

        <div class="card">
            <h2>Recent Videos</h2>
            <div id="recentVideos">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px; color: #666;">Loading recent videos...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTaskId = null;
        let pollInterval = null;

        async function generateVideo(dryRun = false) {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Generating...';

            try {
                const response = await fetch('/api/animal-facts/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dry_run: dryRun, duration: 10 })
                });

                const data = await response.json();

                if (data.task_id) {
                    currentTaskId = data.task_id;
                    displayTask(data);
                    startPolling();
                } else if (data.error) {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Failed to start generation: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = dryRun ? '🧪 Dry Run (Test)' : '🎬 Generate Video';
            }
        }

        function displayTask(data) {
            const html = `
                <div class="info">
                    <p><strong>Animal:</strong> ${data.animal}</p>
                    <p><strong>Fact:</strong> ${data.fact}</p>
                    <p><strong>Status:</strong> <span class="status ${data.status}">${data.status}</span></p>
                    <p><strong>Task ID:</strong> ${data.task_id}</p>
                    <p><strong>Estimated Time:</strong> ${data.estimated_time || '2-5 minutes'}</p>
                </div>
                ${data.video ? `
                    <div class="video-container">
                        <h3>Generated Video</h3>
                        <video controls src="${data.video}"></video>
                        <p><a href="${data.video}" target="_blank">Open in new tab</a></p>
                    </div>
                ` : '<p style="color: #666; margin-top: 15px;">⏳ Video is being generated... This page will update automatically.</p>'}
            `;
            document.getElementById('currentTask').innerHTML = html;
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);

            pollInterval = setInterval(async () => {
                if (!currentTaskId) return;

                try {
                    const response = await fetch(`/api/tasks/${currentTaskId}`);
                    const data = await response.json();

                    if (data.status === 'completed' || data.status === 'error') {
                        clearInterval(pollInterval);
                        displayTask(data);
                        loadRecentVideos();
                    } else {
                        displayTask(data);
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 5000); // Poll every 5 seconds
        }

        async function loadRecentVideos() {
            try {
                const response = await fetch('/api/scheduler/logs?limit=10');
                const data = await response.json();

                if (data.logs && data.logs.length > 0) {
                    const html = data.logs.map(log => `
                        <div class="task-item">
                            <p><strong>${log.animal || 'Unknown Animal'}</strong></p>
                            <p style="font-size: 14px; color: #666;">${log.fact || 'No fact available'}</p>
                            <p style="font-size: 12px; color: #999; margin-top: 5px;">${new Date(log.timestamp).toLocaleString()}</p>
                            ${log.video_url ? `<a href="${log.video_url}" target="_blank">View Video</a>` : ''}
                        </div>
                    `).join('');
                    document.getElementById('recentVideos').innerHTML = html;
                } else {
                    document.getElementById('recentVideos').innerHTML = '<p style="color: #666;">No videos generated yet.</p>';
                }
            } catch (error) {
                document.getElementById('recentVideos').innerHTML = '<p style="color: #999;">Could not load recent videos.</p>';
            }
        }

        // Load recent videos on page load
        loadRecentVideos();
    </script>
</body>

</html>
