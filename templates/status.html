<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Status - OMNI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .status-badge.healthy {
            background: #10b981;
            color: white;
        }

        .status-badge.warning {
            background: #f59e0b;
            color: white;
        }

        .status-badge.error {
            background: #ef4444;
            color: white;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .history {
            margin-top: 40px;
        }

        .history h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }

        .history-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .history-icon {
            font-size: 24px;
        }

        .history-content {
            flex: 1;
        }

        .history-time {
            font-size: 12px;
            color: #666;
        }

        .history-details {
            font-size: 14px;
            color: #333;
            margin-top: 4px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .refresh-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🤖 Workflow Status</h1>
        <div class="status-badge healthy" id="statusBadge">🟢 HEALTHY</div>

        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-label">Last Run</div>
                <div class="stat-value" id="lastRun">Loading...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Next Run</div>
                <div class="stat-value" id="nextRun">In 6 hours</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Success Rate</div>
                <div class="stat-value" id="successRate">100%</div>
            </div>
        </div>

        <div class="history">
            <h2>Recent Activity</h2>
            <div id="historyList">
                <div class="history-item">
                    <div class="history-icon">⏳</div>
                    <div class="history-content">
                        <div class="history-time">Loading...</div>
                        <div class="history-details">Fetching recent runs...</div>
                    </div>
                </div>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadStatus()">🔄 Refresh</button>
    </div>

    <script>
        async function loadStatus() {
            try {
                const response = await fetch('/api/scheduler/logs?limit=10');
                const data = await response.json();

                if (data.logs && data.logs.length > 0) {
                    const logs = data.logs;
                    const lastLog = logs[logs.length - 1];

                    // Update last run
                    const lastRunTime = new Date(lastLog.timestamp);
                    const now = new Date();
                    const hoursAgo = Math.floor((now - lastRunTime) / (1000 * 60 * 60));
                    document.getElementById('lastRun').textContent = hoursAgo === 0 ? 'Just now' : `${hoursAgo}h ago`;

                    // Calculate success rate
                    const successes = logs.filter(l => l.status === 'success').length;
                    const rate = Math.round((successes / logs.length) * 100);
                    document.getElementById('successRate').textContent = `${rate}%`;

                    // Update status badge
                    const statusBadge = document.getElementById('statusBadge');
                    if (lastLog.status === 'success') {
                        statusBadge.className = 'status-badge healthy';
                        statusBadge.textContent = '🟢 HEALTHY';
                    } else {
                        statusBadge.className = 'status-badge error';
                        statusBadge.textContent = '🔴 LAST RUN FAILED';
                    }

                    // Update history
                    const historyHTML = logs.reverse().map(log => {
                        const icon = log.status === 'success' ? '✅' : '❌';
                        const time = new Date(log.timestamp).toLocaleString();
                        const animal = log.animal || 'Unknown';
                        return `
                            <div class="history-item">
                                <div class="history-icon">${icon}</div>
                                <div class="history-content">
                                    <div class="history-time">${time}</div>
                                    <div class="history-details">${animal} - ${log.status}</div>
                                </div>
                            </div>
                        `;
                    }).join('');

                    document.getElementById('historyList').innerHTML = historyHTML;
                } else {
                    document.getElementById('lastRun').textContent = 'Never';
                    document.getElementById('historyList').innerHTML = `
                        <div class="history-item">
                            <div class="history-icon">ℹ️</div>
                            <div class="history-content">
                                <div class="history-details">No runs yet. Workflow will start automatically.</div>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Failed to load status:', error);
            }
        }

        // Load on page load
        loadStatus();

        // Auto-refresh every 30 seconds
        setInterval(loadStatus, 30000);
    </script>
</body>

</html>
